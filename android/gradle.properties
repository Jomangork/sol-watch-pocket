# Sized for MiniTestPC (5.6 GB RAM shared with the SOL-Watch bridges).
# tools/build.sh also caps the whole build at 1.8 GB.
org.gradle.jvmargs=-Xmx1280m -XX:MaxMetaspaceSize=512m -XX:+UseSerialGC -Dfile.encoding=UTF-8
org.gradle.daemon=false
org.gradle.parallel=false
org.gradle.workers.max=2
org.gradle.caching=true
# Compile Kotlin inside the Gradle process instead of a second JVM.
kotlin.compiler.execution.strategy=in-process
android.useAndroidX=true
android.nonTransitiveRClass=true
